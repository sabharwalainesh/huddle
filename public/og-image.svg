<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8611A"/>
      <stop offset="100%" stop-color="#F5923E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow blob -->
  <circle cx="600" cy="315" r="260" fill="#E8611A" opacity="0.08" filter="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="530" y="170" width="72" height="72" rx="20" fill="url(#brand)"/>
  <!-- Users icon inside logo -->
  <circle cx="574" cy="193" r="9" fill="rgba(255,255,255,0.7)"/>
  <path d="M558 226c0-10 7.2-16 16-16s16 6 16 16" fill="rgba(255,255,255,0.7)"/>
  <circle cx="562" cy="197" r="10" fill="white"/>
  <path d="M544 228c0-11.5 8-18 18-18s18 6.5 18 18" fill="white"/>

  <!-- Wordmark -->
  <text x="600" y="312" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="700" font-size="88" fill="white" letter-spacing="-3">Huddle</text>

  <!-- Tagline -->
  <text x="600" y="364" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.5)" letter-spacing="0.5">Discover &amp; support local businesses</text>

  <!-- Bottom pill -->
  <rect x="476" y="420" width="248" height="44" rx="22" fill="url(#brand)" opacity="0.15"/>
  <rect x="476" y="420" width="248" height="44" rx="22" stroke="#E8611A" stroke-width="1" fill="none" opacity="0.3"/>
  <text x="600" y="448" text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="600" font-size="16" fill="#F5923E" letter-spacing="2">COMMUNITY-POWERED</text>
</svg>
